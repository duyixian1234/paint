<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP HTTP 测试页</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 24px;
            background: #f5f7fb;
            color: #1f2937;
        }
        .container {
            max-width: 860px;
            margin: 0 auto;
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }
        h1 {
            margin-top: 0;
            font-size: 24px;
        }
        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: 600;
        }
        input, select, textarea, button {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
        }
        textarea {
            min-height: 140px;
            resize: vertical;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        button {
            margin-top: 14px;
            background: #2563eb;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background: #1d4ed8;
        }
        .result {
            margin-top: 16px;
            padding: 12px;
            background: #0f172a;
            color: #e2e8f0;
            border-radius: 8px;
            min-height: 100px;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MCP HTTP 服务测试</h1>
        <label for="url">请求地址</label>
        <input id="url" value="http://127.0.0.1:3000" />

        <label for="method">请求方法</label>
        <select id="method">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
        </select>

        <label for="body">请求体（JSON，可选）</label>
        <textarea id="body" placeholder='{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'></textarea>

        <button id="send-btn">发送请求</button>
        <pre id="result" class="result">等待请求...</pre>
    </div>

    <script>
        const urlInput = document.getElementById("url");
        const methodSelect = document.getElementById("method");
        const bodyInput = document.getElementById("body");
        const result = document.getElementById("result");
        const sendBtn = document.getElementById("send-btn");

        sendBtn.addEventListener("click", async () => {
            const method = methodSelect.value;
            const url = urlInput.value.trim();

            if (!url) {
                result.textContent = "请输入请求地址";
                return;
            }

            const options = { method, headers: {} };
            const bodyText = bodyInput.value.trim();
            if (bodyText && method !== "GET") {
                try {
                    JSON.parse(bodyText);
                } catch (error) {
                    result.textContent = `请求体 JSON 格式错误: ${error.message}`;
                    return;
                }
                options.headers["Content-Type"] = "application/json";
                options.body = bodyText;
            }

            result.textContent = "请求中...";

            try {
                const response = await fetch(url, options);
                const text = await response.text();
                result.textContent = `Status: ${response.status} ${response.statusText}\n\n${text}`;
            } catch (error) {
                result.textContent = `请求失败: ${error.message}`;
            }
        });
    </script>
</body>
</html>
